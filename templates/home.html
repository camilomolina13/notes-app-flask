<!DOCTYPE html>
<html lang=”es”>

<head>
    <meta charset=”UTF-8″ />
    <title>Página de inicio</title>
</head>

<body>
    <h1>Bienvenido a Flask Notes</h1>
    <h2>Todas las notas</h2>
    <ul>            
        {% for note in notes%}
            <li>
                {{note.id}}
                <br>
                {{note.title}}
                <br>
                {{note.content}}
                <br>
                {{note.created_at.strftime("%d %B %Y - %H:%M")}}
                <a href="{{ url_for('edit_note', id=note.id) }}">✏️ Editar</a>
                <form action="{{url_for('delete_note', id=note.id)}}" method="POST" onsubmit="return confirm('Seguro deseas eliminar estar nota?');">
                        <button type="submit">Eliminar</button>
                </form>
            </li>
        {% else %}
        Aun no se han creado notas
        {% endfor %}            
    </ul>

    <a href="{{ url_for('createNote') }}">Agregar una nueva nota</a>
</body>

</html>
